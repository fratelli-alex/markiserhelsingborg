<title>Markiser Helsingborg designriktning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Granskningsram: en mörk petrolram runt förhandsvisningen, flikar för A/B/C och bredd. Ett utseende, båda teman. */
:root{--ram:#182D35;--ram-2:#304750;--sand:#E3E1DB;--text:#FFFFFF;--dämpad:#B9C4C7;color-scheme:dark}
body{background:var(--ram);color:var(--text);font:400 15px/1.5 Poppins,system-ui,sans-serif}
.huvud{display:grid;gap:14px;padding-block:20px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}h1 span{color:var(--dämpad);font-weight:400}
.rad{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.grupp{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-weight:600;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--ram-2);background:transparent;color:var(--text);cursor:pointer}
button[aria-pressed="true"]{background:var(--sand);color:var(--ram);border-color:var(--sand)}
button:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.beskr{color:var(--dämpad);max-width:70ch;margin:0}
.scen{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px;display:flex;justify-content:center}
iframe{width:100%;max-width:1360px;height:78vh;min-height:560px;border:0;border-radius:10px;background:#fff;transition:max-width .25s}
.mobil iframe{max-width:390px;height:780px}
@media (prefers-reduced-motion:reduce){iframe{transition:none}}
</style>
<div class="huvud">
<h1>Markiser Helsingborg <span>designriktning, välj A, B eller C</span></h1>
<div class="rad">
<div class="grupp" role="group" aria-label="Riktning"><button id="vA" data-r="a" aria-pressed="true">A Petrol</button><button id="vB" data-r="b" aria-pressed="false">B Ljus</button><button id="vC" data-r="c" aria-pressed="false">C Ordmärket</button></div>
<div class="grupp" role="group" aria-label="Bredd"><button id="bD" data-b="d" aria-pressed="true">Dator</button><button id="bM" data-b="m" aria-pressed="false">Mobil 390 px</button></div>
</div>
<p class="beskr" id="beskr"></p>
</div>
<div class="scen" id="scen"><iframe id="ram" src="a.html" title="Förhandsvisning"></iframe></div>
<script>
const B={a:'Profilens färger rakt av: mörk petrol över hela hero-bilden, sand som ytfärg och runda knappar. Mest lik markisbyran.se.',
b:'Ljus och luftig: text och bild sida vid sida, petrol bara i text och knappar, mjuka hörn. Lugnast och mest lättläst.',
c:'Ordmärket som grafiskt grepp: stor gemen rubrik med punkt som i Markisbyråns logga, bild i full bredd och sand som grund. Mest egen karaktär.'};
const ram=document.getElementById('ram'),scen=document.getElementById('scen'),beskr=document.getElementById('beskr');
function visa(r){ram.src=r+'.html';beskr.textContent=B[r];document.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.r===r))}
document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>visa(x.dataset.r));
document.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{scen.classList.toggle('mobil',x.dataset.b==='m');document.querySelectorAll('[data-b]').forEach(y=>y.setAttribute('aria-pressed',y===x))});
const h=(location.hash||'').slice(1).toLowerCase();visa(B[h]?h:'a');
</script>
